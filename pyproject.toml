[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-pdf-viewer"
version = "0.2.0"
description = "A fast, minimal PDF reader with browser-style navigation and AI translation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["pywebview>=5.0"]
authors = [{ name = "Stewart222b" }]
keywords = ["pdf", "viewer", "webview"]
classifiers = [
  "Environment :: Win32 (MS Windows)",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Viewers",
]

[project.scripts]
fast-pdf = "desktop.app:main"

[project.urls]
Homepage = "https://github.com/Stewart222b/fast-pdf-viewer"
Repository = "https://github.com/Stewart222b/fast-pdf-viewer"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["desktop*"]

[tool.setuptools.package-data]
desktop = ["web/**/*", "samples/**/*"]
