<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>速览</title>
    <link rel="stylesheet" href="./vendor/pdfjs/web/pdf_viewer.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-folder-open" viewBox="0 0 24 24">
        <path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2" />
      </symbol>
      <symbol id="i-panel-left" viewBox="0 0 24 24">
        <rect width="18" height="18" x="3" y="3" rx="2" />
        <path d="M9 3v18" />
      </symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24">
        <path d="m12 19-7-7 7-7" />
        <path d="M19 12H5" />
      </symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24">
        <path d="M5 12h14" />
        <path d="m12 5 7 7-7 7" />
      </symbol>
      <symbol id="i-chevron-up" viewBox="0 0 24 24">
        <path d="m18 15-6-6-6 6" />
      </symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6" />
      </symbol>
      <symbol id="i-minus" viewBox="0 0 24 24">
        <path d="M5 12h14" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M5 12h14" />
        <path d="M12 5v14" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </symbol>
      <symbol id="i-retry" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </symbol>
    </svg>

    <div id="app">
      <header class="toolbar">
        <div class="toolbar-left">
          <div class="toolbar-group">
            <button id="btn-open" class="tool-btn primary" type="button" title="打开" aria-label="打开，Ctrl+O">
              <svg class="icon"><use href="#i-folder-open" /></svg>
            </button>
            <button id="btn-sidebar" class="tool-btn" type="button" title="侧栏" aria-label="侧栏" aria-pressed="true">
              <svg class="icon"><use href="#i-panel-left" /></svg>
            </button>
          </div>
          <div class="divider"></div>
          <div class="toolbar-history" aria-label="阅读历史">
            <button id="btn-back" class="tool-btn quiet" type="button" title="后退" aria-label="后退，Alt+←" disabled>
              <svg class="icon"><use href="#i-arrow-left" /></svg>
            </button>
            <button id="btn-forward" class="tool-btn quiet" type="button" title="前进" aria-label="前进，Alt+→" disabled>
              <svg class="icon"><use href="#i-arrow-right" /></svg>
            </button>
          </div>
          <div class="divider"></div>
          <div class="toolbar-group page-nav">
            <div class="page-step">
              <button id="btn-page-prev" class="tool-btn step" type="button" title="上一页" aria-label="上一页，↑" disabled>
                <svg class="icon"><use href="#i-chevron-up" /></svg>
              </button>
              <button id="btn-page-next" class="tool-btn step" type="button" title="下一页" aria-label="下一页，↓" disabled>
                <svg class="icon"><use href="#i-chevron-down" /></svg>
              </button>
            </div>
            <label class="page-box">
              <input id="page-input" class="page-input" type="text" inputmode="numeric" pattern="[0-9]*" value="1" aria-label="当前页码" />
              <span class="page-total">/ <b id="page-count">0</b></span>
            </label>
          </div>
        </div>
        <div class="toolbar-center"></div>
        <div class="toolbar-right">
          <div class="toolbar-group zoom-group">
            <button id="btn-zoom-out" class="tool-btn" type="button" title="缩小" aria-label="缩小，Ctrl+-">
              <svg class="icon"><use href="#i-minus" /></svg>
            </button>
            <div id="zoom-picker" class="zoom-picker">
              <button id="zoom-button" class="tool-btn zoom-trigger" type="button" title="缩放" aria-label="缩放" aria-haspopup="menu" aria-expanded="false" aria-controls="zoom-menu">
                <span id="zoom-label">150%</span>
                <svg class="icon chevron"><use href="#i-chevron-down" /></svg>
              </button>
              <div id="zoom-menu" class="zoom-menu" role="menu" aria-label="缩放" hidden></div>
              <select id="zoom-select" title="缩放" hidden>
                <option value="page-width">适合宽度</option>
                <option value="page-fit">适合页面</option>
                <option value="100">100%</option>
                <option value="125">125%</option>
                <option value="150" selected>150%</option>
                <option value="200">200%</option>
                <option value="250">250%</option>
              </select>
            </div>
            <button id="btn-zoom-in" class="tool-btn" type="button" title="放大" aria-label="放大，Ctrl+=">
              <svg class="icon"><use href="#i-plus" /></svg>
            </button>
          </div>
          <div class="divider"></div>
          <button id="btn-search" class="tool-btn framed" type="button" title="搜索" aria-label="搜索，Ctrl+F" aria-pressed="false">
            <svg class="icon"><use href="#i-search" /></svg>
          </button>
          <button id="btn-settings" class="tool-btn framed" type="button" title="设置" aria-label="设置">
            <svg class="icon"><use href="#i-settings" /></svg>
          </button>
        </div>
      </header>

      <div class="title-strip">
        <span id="doc-title" class="doc-title">未打开文件</span>
      </div>

      <div class="workspace">
        <aside id="sidebar" class="sidebar" aria-hidden="false">
          <div class="sidebar-inner">
            <div class="sidebar-tabs">
              <button data-tab="outline" class="tab active" type="button">目录</button>
              <button data-tab="search" class="tab" type="button">搜索</button>
            </div>
            <div id="outline-pane" class="sidebar-pane active"></div>
            <div id="search-pane" class="sidebar-pane">
              <div class="sidebar-search">
                <svg class="icon search-field-icon" aria-hidden="true"><use href="#i-search" /></svg>
                <input id="search-input" type="search" placeholder="搜索" aria-label="搜索文档，Ctrl+F" />
                <span id="search-count" class="search-count" hidden></span>
                <button id="search-prev" class="tool-btn tiny" type="button" title="上一条" aria-label="上一条，Shift+Enter" disabled>
                  <svg class="icon"><use href="#i-chevron-up" /></svg>
                </button>
                <button id="search-next" class="tool-btn tiny" type="button" title="下一条" aria-label="下一条，Enter" disabled>
                  <svg class="icon"><use href="#i-chevron-down" /></svg>
                </button>
              </div>
              <div id="search-results" class="search-results">
                <div class="empty-side">输入关键词后，这里会列出全部命中。</div>
              </div>
            </div>
          </div>
        </aside>
        <main id="viewer-wrap" class="viewer-wrap">
          <div id="drop-hint" class="drop-hint">
            <div class="empty-card">
              <h1>速览</h1>
              <p>把 PDF 拖到这里，或打开本地文件。</p>
              <button id="btn-open-empty" class="btn primary" type="button">打开 PDF</button>
            </div>
          </div>
          <div id="pages" class="pages pdfViewer"></div>
        </main>
      </div>
    </div>

    <button id="translate-chip" class="translate-chip" type="button" hidden title="翻译选中文本">译</button>

    <div id="translate-bubble" class="translate-bubble" hidden>
      <div class="bubble-actions">
        <span class="bubble-title">翻译</span>
        <button id="btn-copy" class="btn tiny" type="button" title="复制">
          <svg class="icon"><use href="#i-copy" /></svg>
          复制
        </button>
        <button id="btn-translate-retry" class="btn tiny" type="button" title="重试">
          <svg class="icon"><use href="#i-retry" /></svg>
          重试
        </button>
        <button id="btn-bubble-close" class="btn icon tiny" type="button" title="关闭" aria-label="关闭，Esc">
          <svg class="icon"><use href="#i-x" /></svg>
        </button>
      </div>
      <div class="bubble-body">
        <div id="translate-source" class="bubble-source"></div>
        <div id="translate-result" class="bubble-result" hidden></div>
      </div>
    </div>

    <div id="pdf-password-modal" class="modal" hidden>
      <div class="modal-card">
        <h2>需要 PDF 密码</h2>
        <p class="hint">此文档已加密，请输入打开密码。</p>
        <p id="pdf-password-error" class="hint error" hidden></p>
        <label>
          密码
          <input id="pdf-password-input" type="password" autocomplete="off" />
        </label>
        <div class="modal-actions">
          <button id="pdf-password-cancel" class="btn">取消</button>
          <button id="pdf-password-submit" class="btn primary">打开</button>
        </div>
      </div>
    </div>

    <div id="settings-modal" class="modal" hidden>
      <div class="modal-card">
        <h2>翻译设置</h2>
        <p class="hint">
          API Key 与 Base URL 仅保存在本机浏览器的 <code>localStorage</code> 中，不会经过我们的服务器。
          翻译时，选中文本与你的设置会直接从本机发往你配置的 API 端点。
        </p>
        <label>
          API Base URL
          <input id="setting-base" type="url" autocomplete="off" placeholder="https://openrouter.ai/api/v1" />
        </label>
        <label>
          API Key
          <input id="setting-key" type="password" autocomplete="off" placeholder="sk-or-v1-..." />
        </label>
        <label>
          模型
          <div class="model-picker">
            <input id="setting-model" type="text" autocomplete="off" placeholder="openai/gpt-4o-mini" />
            <ul id="setting-model-menu" class="model-menu" hidden></ul>
            <div id="setting-model-status" class="model-picker-status" hidden></div>
          </div>
        </label>
        <label class="setting-checkbox" for="setting-auto-translate">
          <input id="setting-auto-translate" type="checkbox" checked />
          <span class="setting-checkbox-label">划词后自动翻译</span>
        </label>
        <label>
          目标语言
          <select id="setting-lang">
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁体中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </label>
        <div class="modal-actions">
          <button id="btn-settings-cancel" class="btn">取消</button>
          <button id="btn-settings-save" class="btn primary">保存</button>
        </div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
