<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>速览</title>
    <link rel="stylesheet" href="./vendor/pdfjs/web/pdf_viewer.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <symbol id="i-folder-open" viewBox="0 0 24 24">
        <path d="m6 14 1.45-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.55 6a2 2 0 0 1-1.94 1.5H4a2 2 0 0 1-2-2V5c0-1.1.9-2 2-2h3.93a2 2 0 0 1 1.66.9l.82 1.2a2 2 0 0 0 1.66.9H18a2 2 0 0 1 2 2v2" />
      </symbol>
      <symbol id="i-panel-left" viewBox="0 0 24 24">
        <rect width="18" height="18" x="3" y="3" rx="2" />
        <path d="M9 3v18" />
      </symbol>
      <symbol id="i-arrow-left" viewBox="0 0 24 24">
        <path d="m12 19-7-7 7-7" />
        <path d="M19 12H5" />
      </symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24">
        <path d="M5 12h14" />
        <path d="m12 5 7 7-7 7" />
      </symbol>
      <symbol id="i-chevron-up" viewBox="0 0 24 24">
        <path d="m18 15-6-6-6 6" />
      </symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6" />
      </symbol>
      <symbol id="i-minus" viewBox="0 0 24 24">
        <path d="M5 12h14" />
      </symbol>
      <symbol id="i-plus" viewBox="0 0 24 24">
        <path d="M5 12h14" />
        <path d="M12 5v14" />
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.3-4.3" />
      </symbol>
      <symbol id="i-settings" viewBox="0 0 24 24">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z" />
        <circle cx="12" cy="12" r="3" />
      </symbol>
      <symbol id="i-copy" viewBox="0 0 24 24">
        <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
        <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </symbol>
    </svg>
    <div id="app">
      <header class="toolbar">
        <div class="toolbar-left">
          <span class="tb-group" role="group" aria-label="文件与导航">
            <button id="btn-open" class="btn primary has-icon" title="打开 PDF (Ctrl+O)"><svg class="icon" aria-hidden="true"><use href="#i-folder-open" /></svg><span>打开</span></button>
            <button id="btn-sidebar" class="btn toolbar-ghost has-icon" title="显示/隐藏目录侧栏" aria-pressed="false"><svg class="icon" aria-hidden="true"><use href="#i-panel-left" /></svg><span>目录</span></button>
            <button id="btn-back" class="btn toolbar-ghost icon" title="返回（鼠标侧键 / Alt+← / Backspace）" aria-label="返回" disabled><svg class="icon" aria-hidden="true"><use href="#i-arrow-left" /></svg></button>
            <button id="btn-forward" class="btn toolbar-ghost icon" title="前进（鼠标侧键 / Alt+→）" aria-label="前进" disabled><svg class="icon" aria-hidden="true"><use href="#i-arrow-right" /></svg></button>
          </span>
          <span class="tb-divider" aria-hidden="true"></span>
          <span class="tb-group" role="group" aria-label="页码">
            <label class="page-box" title="输入页码后回车跳转">
              <input id="page-input" class="page-input" type="text" inputmode="numeric" pattern="[0-9]*" value="—" aria-label="当前页码" disabled />
              <span class="page-total">/ <b id="page-count">—</b></span>
            </label>
          </span>
        </div>
        <div class="toolbar-center">
          <span id="doc-title" class="doc-title" title="未打开文件">未打开文件</span>
        </div>
        <div class="toolbar-right">
          <span class="tb-group" role="group" aria-label="缩放">
            <button id="btn-zoom-out" class="btn toolbar-ghost icon" title="缩小 (Ctrl+-)" aria-label="缩小"><svg class="icon" aria-hidden="true"><use href="#i-minus" /></svg></button>
            <span id="zoom-picker" class="zoom-picker">
              <button id="zoom-button" class="btn toolbar-ghost has-icon" type="button" title="缩放" aria-haspopup="menu" aria-expanded="false" aria-controls="zoom-menu">
                <span id="zoom-label">150%</span><svg class="icon chevron" aria-hidden="true"><use href="#i-chevron-down" /></svg>
              </button>
              <span id="zoom-menu" class="zoom-menu" role="menu" aria-label="缩放" hidden></span>
              <select id="zoom-select" title="缩放" hidden>
                <option value="page-width">适合宽度</option>
                <option value="page-fit">适合页面</option>
                <option value="100">100%</option>
                <option value="125">125%</option>
                <option value="150" selected>150%</option>
                <option value="200">200%</option>
                <option value="250">250%</option>
              </select>
            </span>
            <button id="btn-zoom-in" class="btn toolbar-ghost icon" title="放大 (Ctrl+=)" aria-label="放大"><svg class="icon" aria-hidden="true"><use href="#i-plus" /></svg></button>
          </span>
          <span class="tb-divider" aria-hidden="true"></span>
          <span class="tb-group" role="group" aria-label="搜索">
            <button id="btn-search-toggle" class="btn toolbar-ghost icon" type="button" title="搜索 (Ctrl+F)" aria-label="搜索" aria-expanded="false" hidden><svg class="icon" aria-hidden="true"><use href="#i-search" /></svg></button>
            <span class="search-box" id="search-box">
              <svg class="icon search-icon" aria-hidden="true"><use href="#i-search" /></svg>
              <input id="search-input" type="search" placeholder="搜索文档 (Ctrl+F)" aria-label="搜索文档" autocomplete="off" />
              <button id="search-clear" class="search-clear" type="button" title="清除搜索" aria-label="清除搜索" hidden><svg class="icon" aria-hidden="true"><use href="#i-x" /></svg></button>
            </span>
          </span>
          <span class="tb-divider" aria-hidden="true"></span>
          <span class="tb-group" role="group" aria-label="更多">
            <button id="btn-settings" class="btn toolbar-ghost icon" title="设置" aria-label="设置"><svg class="icon" aria-hidden="true"><use href="#i-settings" /></svg></button>
          </span>
        </div>
      </header>

      <div class="workspace">
        <aside id="sidebar" class="sidebar" aria-hidden="true" inert>
          <div class="sidebar-inner">
            <div class="sidebar-head">
              <div class="sidebar-tabs" role="tablist" aria-label="侧栏模式">
                <button id="sidebar-tab-outline" class="sidebar-tab" type="button" role="tab" aria-selected="true">目录</button>
                <button id="sidebar-tab-search" class="sidebar-tab" type="button" role="tab" aria-selected="false">搜索</button>
              </div>
              <span id="outline-tree-actions" class="outline-tree-actions" hidden>
                <button id="btn-outline-expand-all" class="btn toolbar-ghost icon tiny" type="button" title="全部展开" aria-label="全部展开"><svg class="icon" aria-hidden="true"><use href="#i-chevron-down" /></svg></button>
                <button id="btn-outline-collapse-all" class="btn toolbar-ghost icon tiny" type="button" title="全部折叠（保留顶层）" aria-label="全部折叠，保留顶层目录"><svg class="icon" aria-hidden="true"><use href="#i-chevron-up" /></svg></button>
              </span>
              <button id="btn-sidebar-close" class="btn toolbar-ghost icon tiny" type="button" title="关闭侧栏" aria-label="关闭侧栏"><svg class="icon" aria-hidden="true"><use href="#i-x" /></svg></button>
            </div>
            <div id="outline-pane" class="sidebar-pane active" role="tree" aria-label="文档目录"></div>
            <div id="search-pane" class="sidebar-pane">
              <div class="search-pane-bar">
                <span id="search-count" class="search-count" hidden></span>
                <span class="search-pane-nav">
                  <button id="search-prev" class="btn toolbar-ghost icon tiny" type="button" title="上一个 (Shift+Enter)" aria-label="上一个" disabled><svg class="icon" aria-hidden="true"><use href="#i-chevron-up" /></svg></button>
                  <button id="search-next" class="btn toolbar-ghost icon tiny" type="button" title="下一个 (Enter)" aria-label="下一个" disabled><svg class="icon" aria-hidden="true"><use href="#i-chevron-down" /></svg></button>
                </span>
              </div>
              <div id="search-list" class="search-list"></div>
            </div>
          </div>
        </aside>
        <main id="viewer-wrap" class="viewer-wrap">
          <div id="viewer-status" class="viewer-status" hidden>
            <p id="viewer-status-text" class="viewer-status-text" role="status"></p>
            <button id="viewer-status-action" class="btn primary" type="button" hidden>重新选择文件</button>
          </div>
          <div id="drop-hint" class="drop-hint">
            <div class="empty-state">
              <h1>速览</h1>
              <p>把 PDF 拖到这里，或打开本地文件。</p>
              <button id="btn-open-empty" class="btn primary" type="button">打开 PDF</button>
              <ul>
                <li>鼠标侧键 / Alt+← 返回刚才的位置</li>
                <li>搜索会列出全部结果，并显示第几条</li>
                <li>划词即译（OpenAI 兼容 API，默认 OpenRouter）</li>
              </ul>
            </div>
          </div>
          <div id="pages" class="pages pdfViewer"></div>
        </main>
      </div>
    </div>

    <button id="translate-chip" class="translate-chip" type="button" hidden title="翻译选中文本">译</button>

    <div id="translate-bubble" class="translate-bubble" hidden>
      <div class="bubble-body">
        <div id="translate-source" class="bubble-source"></div>
        <button id="btn-source-toggle" class="link-btn source-toggle" type="button" hidden>展开原文</button>
        <div id="translate-result" class="bubble-result" hidden></div>
      </div>
      <div class="bubble-actions">
        <button id="btn-translate-cancel" class="btn tiny" hidden>取消</button>
        <span class="bubble-actions-spacer"></span>
        <button id="btn-copy" class="btn tiny has-icon"><svg class="icon" aria-hidden="true"><use href="#i-copy" /></svg>复制</button>
        <button id="btn-bubble-close" class="btn icon tiny bubble-close" title="关闭 (Esc)" aria-label="关闭"><svg class="icon" aria-hidden="true"><use href="#i-x" /></svg></button>
      </div>
    </div>

    <div id="pdf-password-modal" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="pdf-password-title">
        <h2 id="pdf-password-title">需要 PDF 密码</h2>
        <p class="hint">此文档已加密，请输入打开密码。</p>
        <p id="pdf-password-error" class="hint error" hidden></p>
        <label>
          密码
          <input id="pdf-password-input" type="password" autocomplete="off" />
        </label>
        <div class="modal-actions">
          <button id="pdf-password-cancel" class="btn">取消</button>
          <button id="pdf-password-submit" class="btn primary">打开</button>
        </div>
      </div>
    </div>

    <div id="settings-modal" class="modal" hidden>
      <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="settings-title">
        <h2 id="settings-title">翻译设置</h2>
        <label>
          API Key
          <input id="setting-key" type="password" autocomplete="off" placeholder="sk-or-v1-..." />
        </label>
        <label>
          模型
          <div class="model-picker">
            <input id="setting-model" type="text" autocomplete="off" placeholder="openai/gpt-4o-mini" />
            <ul id="setting-model-menu" class="model-menu" hidden></ul>
            <div id="setting-model-status" class="model-picker-status" hidden></div>
          </div>
        </label>
        <label>
          目标语言
          <select id="setting-lang">
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁体中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </label>
        <label class="setting-checkbox" for="setting-auto-translate">
          <input id="setting-auto-translate" type="checkbox" checked />
          <span class="setting-checkbox-label">划词后自动翻译</span>
        </label>
        <details class="settings-advanced">
          <summary>高级</summary>
          <p class="hint compact">Base URL 与 Key 只保存在本机浏览器中；翻译直接从本机发往你配置的端点。</p>
          <label>
            API Base URL（OpenAI 兼容）
            <input id="setting-base" type="url" autocomplete="off" placeholder="https://openrouter.ai/api/v1" />
          </label>
        </details>
        <div class="modal-actions">
          <button id="btn-settings-cancel" class="btn">取消</button>
          <button id="btn-settings-save" class="btn primary">保存</button>
        </div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
