<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>速览</title>
    <link rel="stylesheet" href="./vendor/pdfjs/web/pdf_viewer.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="toolbar-left">
          <button id="btn-open" class="btn primary" title="打开 PDF (Ctrl+O)">打开</button>
          <button id="btn-sidebar" class="btn toolbar-ghost" title="显示/隐藏目录侧栏" aria-pressed="false">目录</button>
          <span class="tb-group" role="group" aria-label="历史">
            <button id="btn-back" class="btn toolbar-ghost icon" title="返回（鼠标侧键 / Alt+← / Backspace）" disabled>←</button>
            <button id="btn-forward" class="btn toolbar-ghost icon" title="前进（鼠标侧键 / Alt+→）" disabled>→</button>
          </span>
          <span class="tb-group" role="group" aria-label="页码">
            <label class="page-box">
              <input id="page-input" class="page-input" type="text" inputmode="numeric" pattern="[0-9]*" value="1" aria-label="当前页码" />
              <span class="page-total">/ <b id="page-count">0</b></span>
            </label>
          </span>
        </div>
        <div class="toolbar-center">
          <span id="doc-title" class="doc-title">未打开文件</span>
        </div>
        <div class="toolbar-right">
          <span class="tb-group" role="group" aria-label="缩放">
            <button id="btn-zoom-out" class="btn toolbar-ghost icon" title="缩小 (Ctrl+-)">−</button>
            <span id="zoom-picker" class="zoom-picker">
              <button id="zoom-button" class="btn toolbar-ghost" type="button" title="缩放" aria-haspopup="menu" aria-expanded="false" aria-controls="zoom-menu">
                <span id="zoom-label">150%</span><span aria-hidden="true">⌄</span>
              </button>
              <span id="zoom-menu" class="zoom-menu" role="menu" aria-label="缩放" hidden></span>
              <select id="zoom-select" title="缩放" hidden>
                <option value="page-width">适合宽度</option>
                <option value="page-fit">适合页面</option>
                <option value="100">100%</option>
                <option value="125">125%</option>
                <option value="150" selected>150%</option>
                <option value="200">200%</option>
                <option value="250">250%</option>
              </select>
            </span>
            <button id="btn-zoom-in" class="btn toolbar-ghost icon" title="放大 (Ctrl+=)">+</button>
          </span>
          <span class="tb-group" role="group" aria-label="搜索">
            <span class="search-box">
              <input id="search-input" type="search" placeholder="搜索文档 (Ctrl+F)" aria-label="搜索文档" />
            </span>
          </span>
          <button id="btn-settings" class="btn toolbar-ghost icon" title="设置">⚙</button>
        </div>
      </header>

      <div class="workspace">
        <aside id="sidebar" class="sidebar" aria-hidden="true">
          <div class="sidebar-inner">
            <div class="sidebar-head">
              <span id="sidebar-title" class="sidebar-title">目录</span>
              <button id="btn-sidebar-close" class="btn toolbar-ghost icon tiny" type="button" title="关闭侧栏">×</button>
            </div>
            <div id="outline-pane" class="sidebar-pane active"></div>
            <div id="search-pane" class="sidebar-pane">
              <div class="search-pane-bar">
                <span id="search-count" class="search-count" hidden></span>
                <span class="search-pane-nav">
                  <button id="search-prev" class="btn toolbar-ghost icon tiny" type="button" title="上一个 (Shift+Enter)" disabled>↑</button>
                  <button id="search-next" class="btn toolbar-ghost icon tiny" type="button" title="下一个 (Enter)" disabled>↓</button>
                </span>
              </div>
              <div id="search-list" class="search-list"></div>
            </div>
          </div>
        </aside>
        <main id="viewer-wrap" class="viewer-wrap">
          <div id="drop-hint" class="drop-hint">
            <div>
              <h1>速览</h1>
              <p>把 PDF 拖到这里，或点击左上角打开。</p>
              <ul>
                <li>鼠标侧键 / Alt+← 返回刚才的位置</li>
                <li>搜索会列出全部结果，并显示第几条</li>
                <li>划词即译（OpenAI 兼容 API，默认 OpenRouter）</li>
              </ul>
            </div>
          </div>
          <div id="pages" class="pages pdfViewer"></div>
        </main>
      </div>
    </div>

    <button id="translate-chip" class="translate-chip" type="button" hidden title="翻译选中文本">译</button>

    <div id="translate-bubble" class="translate-bubble" hidden>
      <div class="bubble-body">
        <div id="translate-source" class="bubble-source"></div>
        <div id="translate-result" class="bubble-result" hidden></div>
      </div>
      <div class="bubble-actions">
        <button id="btn-translate-cancel" class="btn tiny" hidden>取消</button>
        <span class="bubble-actions-spacer"></span>
        <button id="btn-copy" class="btn tiny">复制</button>
        <button id="btn-bubble-close" class="btn icon tiny" title="关闭 (Esc)">×</button>
      </div>
    </div>

    <div id="pdf-password-modal" class="modal" hidden>
      <div class="modal-card">
        <h2>需要 PDF 密码</h2>
        <p class="hint">此文档已加密，请输入打开密码。</p>
        <p id="pdf-password-error" class="hint error" hidden></p>
        <label>
          密码
          <input id="pdf-password-input" type="password" autocomplete="off" />
        </label>
        <div class="modal-actions">
          <button id="pdf-password-cancel" class="btn">取消</button>
          <button id="pdf-password-submit" class="btn primary">打开</button>
        </div>
      </div>
    </div>

    <div id="settings-modal" class="modal" hidden>
      <div class="modal-card">
        <h2>翻译设置</h2>
        <p class="hint">
          API Key 与 Base URL 仅保存在本机浏览器的 <code>localStorage</code> 中，不会经过我们的服务器。
          翻译时，选中文本与你的设置会直接从本机发往你配置的 API 端点（默认 OpenRouter）。
        </p>
        <label>
          API Base URL（OpenAI 兼容）
          <input id="setting-base" type="url" autocomplete="off" placeholder="https://openrouter.ai/api/v1" />
        </label>
        <label>
          API Key
          <input id="setting-key" type="password" autocomplete="off" placeholder="sk-or-v1-..." />
        </label>
        <label>
          模型
          <div class="model-picker">
            <input id="setting-model" type="text" autocomplete="off" placeholder="openai/gpt-4o-mini" />
            <ul id="setting-model-menu" class="model-menu" hidden></ul>
            <div id="setting-model-status" class="model-picker-status" hidden></div>
          </div>
        </label>
        <label class="setting-checkbox" for="setting-auto-translate">
          <input id="setting-auto-translate" type="checkbox" checked />
          <span class="setting-checkbox-label">划词后自动翻译</span>
        </label>
        <label>
          目标语言
          <select id="setting-lang">
            <option value="zh-CN">简体中文</option>
            <option value="zh-TW">繁体中文</option>
            <option value="en">English</option>
            <option value="ja">日本語</option>
          </select>
        </label>
        <div class="modal-actions">
          <button id="btn-settings-cancel" class="btn">取消</button>
          <button id="btn-settings-save" class="btn primary">保存</button>
        </div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
